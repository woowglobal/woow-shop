<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WOOW Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@600;700&display=swap">
<link rel="stylesheet" href="/style.css">
<style>
.tabs2{display:flex;gap:6px;margin-bottom:14px}.tabs2 button{height:38px;padding:0 16px;border-radius:12px;border:1.5px solid var(--hair);background:#fff;font-weight:800;cursor:pointer}.tabs2 button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:13px}th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:10px 12px;border-bottom:1px solid var(--hair)}
td{padding:12px;border-bottom:1px solid #F2F2F5;vertical-align:top}tr.r{cursor:pointer}tr.r:hover td{background:#FAFAFC}
.pill{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12px;white-space:nowrap}.pill i{width:8px;height:8px;border-radius:50%;background:#C7C7CC}
.dr{visibility:hidden;position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:#fff;box-shadow:-20px 0 60px rgba(0,0,0,.15);z-index:50;overflow:auto;padding:22px;transform:translateX(100%);transition:transform .25s}.dr.on{transform:none;visibility:visible}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px;margin:10px 0}.kv span{color:var(--mute)}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.act .btn{height:44px;font-size:13.5px;margin:0}
.ev{font-size:12px;color:#424245;border-left:2px solid var(--hair);padding:2px 0 8px 10px}.ev small{color:var(--mute);display:block}
.set{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.set label{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--mute)}
.days{display:flex;gap:8px;flex-wrap:wrap}.days label{flex-direction:row;align-items:center;gap:6px;color:var(--ink)}
@media (max-width:760px){.set{grid-template-columns:1fr 1fr}.hide-m{display:none}}
</style>
</head>
<body>
<header class="hdr"><a class="logo" href="/admin"><i></i>wOOw<small>Admin</small></a><nav><a class="hb" href="/" target="_blank">Open shop ↗</a></nav></header>
<div class="demo" id="demoBar" hidden></div>
<main>
  <div class="tabs2"><button class="on" data-t="orders">Orders</button><button data-t="settings">Settings</button></div>
  <section id="t-orders">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap"><select class="inp" id="fSt" style="width:auto"><option value="">All statuses</option></select><input class="inp" id="fQ" placeholder="Search order no., name, phone" style="max-width:280px"><button class="hb dk" onclick="load()">Refresh</button></div>
    <div class="card" style="overflow:auto"><table><thead><tr><th>Order</th><th>Customer</th><th class="hide-m">Items</th><th>Due / Paid</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
  </section>
  <section id="t-settings" hidden>
    <div class="card sec">
      <h3>Prices &amp; schedule</h3>
      <div class="set">
        <label>Dollar rate (৳ per $1)<input class="inp" id="sRate" type="number" step="0.01"></label>
        <label>Service fee %<input class="inp" id="sFee" type="number" step="0.1"></label>
        <label>Minimum fee ৳<input class="inp" id="sMin" type="number"></label>
        <label>Shipping + customs ৳ per kg<input class="inp" id="sKg" type="number"></label>
        <label>Default weight kg<input class="inp" id="sDef" type="number" step="0.1"></label>
        <label>Days from flight to Dhaka<input class="inp" id="sLand" type="number"></label>
      </div>
      <span class="lbl">WOOW flight days</span>
      <div class="days" id="sDays"></div>
      <button class="btn dk" style="margin-top:16px;max-width:240px" onclick="saveSet()">Save settings</button>
    </div>
  </section>
</main>
<aside class="dr" id="dr"></aside>
<div class="toast" id="toast"></div>
<script src="/admin.js"></script>
</body>
</html>
